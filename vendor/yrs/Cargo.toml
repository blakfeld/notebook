# Vendored from yrs 0.28.0 (crates.io) with robustness patches; see
# VENDORED.md. Benches and dev-dependencies are dropped.

[package]
edition = "2018"
name = "yrs"
version = "0.28.0"
authors = [
    "Kevin Jahns <kevin.jahns@pm.me>",
    "Bartosz Sypytkowski <b.sypytkowski@gmail.com>",
]
description = "High performance implementation of the Yjs CRDT"
homepage = "https://github.com/y-crdt/y-crdt/"
readme = "README.md"
keywords = ["crdt", "yrs"]
license = "MIT"
repository = "https://github.com/y-crdt/y-crdt/"
publish = false

[features]
default = []
small-client = []
sync = []
weak = []

[lib]
name = "yrs"
path = "src/lib.rs"

[dependencies]
arc-swap = "1.9"
async-lock = "3.4"
async-trait = "0.1"
dashmap = "6.2"
fastrand = { version = "2", features = ["js"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallstr = { version = "0.3", features = ["union"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "const_new"] }
thiserror = "2"
