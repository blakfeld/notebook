[package]
name = "notebook-core"
description = "Platform-independent core for Notebook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `storage::conformance` so storage backends in other crates can run it.
conformance = []
# Exposes `sync::fake` (in-memory server and manual timer) to other crates' tests.
test-util = []
# The reqwest + tokio-tungstenite transport and tokio timer, for native hosts.
transport-native = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite"]
# The fetch + browser WebSocket transport and gloo timer, for the browser.
transport-wasm = ["dep:gloo-net", "dep:gloo-timers", "dep:js-sys"]

[dependencies]
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
dissimilar.workspace = true
futures.workspace = true
getrandom.workspace = true
gloo-net = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
hkdf.workspace = true
js-sys = { workspace = true, optional = true }
opaque-ke.workspace = true
pulldown-cmark.workspace = true
rand_core.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha2_010.workspace = true
tokio = { workspace = true, optional = true, features = ["time"] }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-native-roots"] }
ulid.workspace = true
unicode-normalization.workspace = true
yrs.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
tempfile.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
