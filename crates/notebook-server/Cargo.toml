[package]
name = "notebook-server"
description = "Notebook sync server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
governor.workspace = true
notebook-core.workspace = true
serde.workspace = true
# sqlx links libsqlite3-sys; rusqlite in local-sqlite-storage must pick a
# compatible version, since Cargo allows one `links = "sqlite3"` crate.
sqlx.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
