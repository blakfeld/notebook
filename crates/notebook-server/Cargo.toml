[package]
name = "notebook-server"
description = "Notebook sync server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
clap.workspace = true
dashmap.workspace = true
governor.workspace = true
notebook-core.workspace = true
opaque-ke.workspace = true
rand_core.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# sqlx links libsqlite3-sys; rusqlite in local-sqlite-storage must pick a
# compatible version, since Cargo allows one `links = "sqlite3"` crate.
sqlx.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-util.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
