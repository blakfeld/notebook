[package]
name = "notebook-app"
description = "Notebook desktop and mobile app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "notebook_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
keyring.workspace = true
notebook-core = { workspace = true, features = ["transport-native"] }
notebook-storage-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
notebook-core = { workspace = true, features = ["transport-native", "test-util"] }
notebook-server.workspace = true
sqlx.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
yrs.workspace = true

[lints]
workspace = true
